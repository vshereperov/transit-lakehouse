bundle:
  name: transit-lakehouse

include:
  - resources/*.yml

workspace:
  host: https://adb-7405605832282795.15.azuredatabricks.net

variables:
  catalog:
    description: Catalog that silver and gold write to
    default: transit_dev
  bronze_catalog:
    description: Catalog that bronze is read from
    default: transit
  ingest:
    description: Whether bronze loads new files from raw
    default: "false"
  serving:
    description: Where gold exports the map data
    default: abfss://serving@sttransitlake.dfs.core.windows.net/dev/rome
  notification_email:
    description: Address for failure and duration alerts, set with BUNDLE_VAR_notification_email

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: transit
      ingest: "true"
      serving: abfss://serving@sttransitlake.dfs.core.windows.net/rome
